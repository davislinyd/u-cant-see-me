<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>IT Center controls fixture</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; }
      #ticket-actions { display: flex; gap: 12px; }
      #ticket-actions button { width: 48px; height: 36px; }
      #ticket-actions svg { width: 16px; height: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>IT Center controls fixture</h1>
      <section id="ticket-actions" aria-label="Ticket actions">
        <button type="button" aria-label="Suggested solutions"><svg aria-hidden="true"></svg></button>
        <button type="button" aria-label="Comment"><svg aria-hidden="true"></svg></button>
        <button type="button" aria-label="Associate"><svg aria-hidden="true"></svg></button>
        <button type="button" aria-label="Complete"><svg aria-hidden="true"></svg></button>
        <button type="button" aria-label="Assign"><svg aria-hidden="true"></svg></button>
        <button type="button" aria-label="Watch"><svg aria-hidden="true"></svg></button>
        <button type="button" aria-label="Translate"><svg aria-hidden="true"></svg></button>
        <button type="button" aria-label="History"><svg aria-hidden="true"></svg></button>
      </section>
    </main>
  </body>
</html>
