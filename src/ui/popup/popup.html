<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U Cant See Me</title>
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div>
          <p class="eyebrow">U CANT SEE ME</p>
          <h1>Privacy protection</h1>
        </div>
        <span class="status-dot" aria-hidden="true"></span>
      </header>

      <section class="status-card" aria-live="polite">
        <div class="status-heading">
          <span>Protection</span>
          <strong id="protection-state">Checking…</strong>
        </div>
        <p id="status-detail">讀取目前分頁狀態中。</p>
      </section>

      <button id="select-elements" class="primary-button" type="button">Select elements</button>
      <button id="edit-masks" class="secondary-button" type="button">Edit masks</button>
      <section id="gmail-protection" class="gmail-protection" hidden>
        <h2>Protect this email</h2>
        <label><input id="gmail-thread-subject" type="checkbox" checked /> Conversation subject</label>
        <label><input id="gmail-message-body" type="checkbox" checked /> Message body</label>
        <label><input id="gmail-collapsed-preview" type="checkbox" checked /> Collapsed preview</label>
        <label><input id="gmail-list-subject" type="checkbox" checked /> Inbox/search subject</label>
        <label><input id="gmail-list-snippet" type="checkbox" checked /> Inbox/search snippet</label>
        <label class="gmail-style">Mask style
          <select id="gmail-mask-style" aria-label="Gmail mask style">
            <option value="black">Black</option>
            <option value="white">White</option>
            <option value="blur">Blur</option>
            <option value="mosaic">Mosaic</option>
          </select>
        </label>
        <button id="protect-gmail" class="primary-button" type="button">Protect</button>
      </section>
      <button id="reveal-all" class="secondary-button" type="button" disabled>Temporarily reveal all</button>

      <section class="page-actions" aria-label="Current page management">
        <p>Current site</p>
        <button id="disable-page" class="link-button" type="button">Disable masks for this page</button>
        <button id="disable-site" class="link-button" type="button">Disable protection for this site</button>
        <button id="remove-page" class="link-button danger-link" type="button">Remove all masks on this page</button>
      </section>

      <div class="divider"></div>

      <div class="page-count">
        <span>Masks on this page</span>
        <strong id="mask-count">0</strong>
      </div>
      <button id="manage-masks" class="link-button" type="button">Manage masks</button>
      <button id="open-settings" class="link-button" type="button">Settings</button>
      <p id="feedback" class="feedback" role="status"></p>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
