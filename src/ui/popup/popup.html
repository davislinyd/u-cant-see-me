<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U Cant See Me</title>
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div>
          <p class="eyebrow">U CANT SEE ME</p>
          <h1 data-i18n="popup.heading">Privacy protection</h1>
        </div>
        <div class="header-actions">
          <div class="language-switch" id="language-switch" role="group" data-i18n-aria-label="lang.toggleLabel" aria-label="Language">
            <button type="button" data-language="zh-Hant">中文</button>
            <button type="button" data-language="en">English</button>
          </div>
          <span class="status-dot" aria-hidden="true"></span>
        </div>
      </header>

      <section class="status-card" aria-live="polite">
        <div class="status-heading">
          <span data-i18n="popup.statusHeading">Protection</span>
          <strong id="protection-state" data-i18n="popup.statusChecking">Checking…</strong>
        </div>
        <p id="status-detail" data-i18n="popup.statusReading">Reading the current tab status…</p>
      </section>

      <button id="select-elements" class="primary-button" type="button" data-i18n="popup.selectElements">Select elements</button>
      <button id="edit-masks" class="secondary-button" type="button" data-i18n="popup.editMasks">Edit masks</button>
      <section id="gmail-protection" class="gmail-protection" hidden>
        <h2 data-i18n="popup.gmail.heading">Protect this email</h2>
        <label><input id="gmail-thread-subject" type="checkbox" checked /> <span data-i18n="popup.gmail.threadSubject">Conversation subject</span></label>
        <label><input id="gmail-message-body" type="checkbox" checked /> <span data-i18n="popup.gmail.messageBody">Message body</span></label>
        <label><input id="gmail-collapsed-preview" type="checkbox" checked /> <span data-i18n="popup.gmail.collapsedPreview">Collapsed preview</span></label>
        <label><input id="gmail-list-subject" type="checkbox" checked /> <span data-i18n="popup.gmail.listSubject">Inbox/search subject</span></label>
        <label><input id="gmail-list-snippet" type="checkbox" checked /> <span data-i18n="popup.gmail.listSnippet">Inbox/search snippet</span></label>
        <label class="gmail-style"><span data-i18n="popup.gmail.maskStyle">Mask style</span>
          <select id="gmail-mask-style" data-i18n-aria-label="popup.gmail.maskStyleAria" aria-label="Gmail mask style">
            <option value="black">Black</option>
            <option value="white">White</option>
            <option value="blur">Blur</option>
          </select>
        </label>
        <button id="protect-gmail" class="primary-button" type="button" data-i18n="popup.gmail.protect">Protect</button>
      </section>
      <button id="reveal-all" class="secondary-button" type="button" data-i18n="popup.revealAll" disabled>Temporarily reveal all</button>

      <section class="page-actions" data-i18n-aria-label="popup.pageActionsAria" aria-label="Current page management">
        <p data-i18n="popup.currentSite">Current site</p>
        <button id="disable-page" class="link-button" type="button" data-i18n="popup.disablePage">Disable masks for this page</button>
        <button id="disable-site" class="link-button" type="button" data-i18n="popup.disableSite">Disable protection for this site</button>
        <button id="remove-page" class="link-button danger-link" type="button" data-i18n="popup.removePage">Remove all masks on this page</button>
      </section>

      <div class="divider"></div>

      <div class="page-count">
        <span data-i18n="popup.maskCountLabel">Masks on this page</span>
        <strong id="mask-count">0</strong>
      </div>
      <button id="manage-masks" class="link-button" type="button" data-i18n="popup.manageMasks">Manage masks</button>
      <button id="open-settings" class="link-button" type="button" data-i18n="popup.settings">Settings</button>
      <p id="feedback" class="feedback" role="status"></p>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
